<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Beat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #stage { display: block; width: 100vw; height: 100vh; background: #000; }

        /* ===== 启动页 ===== */
        #launcher {
            position: fixed; inset: 0; z-index: 20;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 26px;
            background: radial-gradient(ellipse at 50% 38%,
                        rgba(70, 30, 90, 0.95), rgba(15, 8, 25, 0.98) 70%), #0a0512;
            overflow: hidden;
        }
        #launcher .title {
            font-family: "楷体", "Kaiti SC", "STKaiti", serif;
            font-size: 42px; font-weight: bold; letter-spacing: 6px;
            background: linear-gradient(90deg, #ffb3c6, #ff5f8f, #d08bff, #ffd28a, #ffb3c6);
            background-size: 200% auto;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
            animation: shine 4s linear infinite;
            filter: drop-shadow(0 0 14px rgba(255, 110, 160, 0.4));
        }
        @keyframes shine { to { background-position: 200% center; } }

        #launcher .tip {
            font-family: "楷体", "Kaiti SC", "STKaiti", serif;
            font-size: 18px; letter-spacing: 3px; color: #ffd9e8;
            animation: breathe 2.4s ease-in-out infinite;
        }
        @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

        #launcher .sub {
            font-size: 12px; letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.35);
        }

        /* 上浮的小心心装饰 */
        .floatHeart {
            position: absolute; bottom: -40px;
            color: #ff9ec6; text-shadow: 0 0 8px rgba(255, 140, 190, .6);
            animation: rise linear infinite; pointer-events: none;
        }
        @keyframes rise {
            0%   { transform: translateY(0) rotate(0deg);      opacity: 0; }
            12%  { opacity: .9; }
            100% { transform: translateY(-108vh) rotate(50deg); opacity: 0; }
        }

        /* ===== 按钮 ===== */
        .btnRow { display: flex; gap: 24px; align-items: center; z-index: 5; }

        .pink-btn {
            position: relative;
            border: none; outline: none; cursor: pointer; color: #fff;
            font-family: "楷体", "Kaiti SC", "STKaiti", serif;
            font-weight: bold; letter-spacing: 3px;
            background: linear-gradient(135deg, #ff8fb3 0%, #ff5f8f 55%, #e64f9e 100%);
            border-radius: 999px;
            box-shadow: 0 6px 24px rgba(255, 80, 140, 0.45),
                        inset 0 -3px 6px rgba(150, 20, 80, 0.35);
            overflow: hidden;
            animation: hb 1.6s ease-in-out infinite;
            touch-action: manipulation;
            -webkit-user-select: none; user-select: none;
            transition: transform .25s ease;
        }
        @keyframes hb {
            0%, 100% { transform: scale(1); }
            12% { transform: scale(1.07); }
            24% { transform: scale(1); }
            36% { transform: scale(1.05); }
            48% { transform: scale(1); }
        }
        .pink-btn::after {
            content: ''; position: absolute; top: 0; left: -150%;
            width: 60%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            transform: skewX(-20deg);
            animation: sweep 3s ease-in-out infinite;
        }
        @keyframes sweep { 0% { left: -150%; } 55% { left: 150%; } 100% { left: 150%; } }
        .pink-btn:active { animation: none; transform: scale(0.96); }

        #startBtn { font-size: 22px; padding: 16px 44px; }

        /* 拒绝按钮：平时是普通幽灵按钮，逃跑后变固定定位全屏乱跳 */
        #rejectBtn {
            border: 1.5px solid rgba(255, 255, 255, 0.5); outline: none; cursor: pointer;
            color: rgba(255, 255, 255, 0.92);
            font-family: "楷体", "Kaiti SC", "STKaiti", serif;
            font-weight: bold; letter-spacing: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px; font-size: 20px; padding: 14px 38px;
            touch-action: manipulation;
            -webkit-user-select: none; user-select: none;
            transition: left .16s ease-out, top .16s ease-out, transform .25s ease;
        }
        #rejectBtn.fled { position: fixed; margin: 0; z-index: 30; }

        #exitBtn {
            position: fixed; left: 30px; top: 30px;
            font-size: 15px; padding: 10px 26px; letter-spacing: 2px;
            z-index: 15; display: none;
            animation: none;
        }

        /* 提示气泡 */
        #toast {
            position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%);
            padding: 12px 28px; border-radius: 999px;
            background: rgba(255, 95, 143, 0.92); color: #fff;
            font-family: "楷体", "Kaiti SC", "STKaiti", serif;
            font-size: 17px; letter-spacing: 2px; white-space: nowrap;
            opacity: 0; pointer-events: none; transition: opacity .3s;
            z-index: 40; box-shadow: 0 4px 20px rgba(255, 80, 140, 0.5);
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>
<canvas id="stage"></canvas>
<button id="exitBtn" class="pink-btn"> 收 下 ♥&#xFE0E;</button>
<div id="toast"></div>

<div id="launcher">
    <span class="floatHeart" style="left: 8%;  font-size: 20px; animation-duration: 7s;   animation-delay: 0s;">♥&#xFE0E;</span>
    <span class="floatHeart" style="left: 20%; font-size: 28px; animation-duration: 9s;   animation-delay: 1.5s; color:#d08bff;">♥&#xFE0E;</span>
    <span class="floatHeart" style="left: 35%; font-size: 16px; animation-duration: 6.5s; animation-delay: 3s;">♥&#xFE0E;</span>
    <span class="floatHeart" style="left: 52%; font-size: 24px; animation-duration: 8s;   animation-delay: 0.8s; color:#ffb3c6;">♥&#xFE0E;</span>
    <span class="floatHeart" style="left: 68%; font-size: 18px; animation-duration: 7.5s; animation-delay: 2.2s; color:#ffd28a;">♥&#xFE0E;</span>
    <span class="floatHeart" style="left: 82%; font-size: 26px; animation-duration: 9.5s; animation-delay: 1s;  color:#ff8fb3;">♥&#xFE0E;</span>
    <span class="floatHeart" style="left: 92%; font-size: 15px; animation-duration: 6s;   animation-delay: 3.6s; color:#9fd8ff;">♥&#xFE0E;</span>

    <div class="title">Heart Beat ♥&#xFE0E;</div>
    <div class="tip">姐姐，我送你一份礼物哦</div>
    <div class="btnRow">
        <button id="startBtn" class="pink-btn"> 我 想 要 ♥&#xFE0E;</button>
        <button id="rejectBtn"> 我 不 要 </button>
    </div>
    <div class="sub">温馨提示：拒绝按钮已损坏，不支持修复</div>
</div>

<script>
'use strict';
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

/* ===== 拒绝按钮：永远点不到 ===== */
const startBtn = document.getElementById('startBtn');
const rejectBtn = document.getElementById('rejectBtn');
const toast = document.getElementById('toast');
const TAUNTS = ['不 要', '拒 绝 我？', '点 不 到 吧', '别 白 费 力 啦', '所 心 皆 是 你', '还 是 点 同 意 吧'];
let rejectScale = 1, acceptScale = 1, fleeCount = 0, toastTimer = 0;

function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
}

function fleeReject() {
    fleeCount++;
    const pad = 20;
    const w = rejectBtn.offsetWidth, h = rejectBtn.offsetHeight;
    let x = 0, y = 0;
    for (let i = 0; i < 20; i++) {
        x = pad + Math.random() * (window.innerWidth - w - pad * 2);
        y = pad + Math.random() * (window.innerHeight - h - pad * 2);
        const cur = rejectBtn.getBoundingClientRect();
        if (!rejectBtn.classList.contains('fled') ||
            Math.hypot(x - cur.left, y - cur.top) > 140) break;
    }
    if (!rejectBtn.classList.contains('fled')) {
        const r = rejectBtn.getBoundingClientRect();
        rejectBtn.style.width = r.width + 'px';
        rejectBtn.style.height = r.height + 'px';
        rejectBtn.classList.add('fled');
    }
    rejectBtn.style.left = x + 'px';
    rejectBtn.style.top = y + 'px';

    rejectScale = Math.max(0.5, rejectScale - 0.08);   // 越点越小
    acceptScale = Math.min(1.3, acceptScale + 0.05);   // 同意越来越大
    rejectBtn.style.transform = `scale(${rejectScale})`;
    startBtn.style.transform = `scale(${acceptScale})`;

    rejectBtn.textContent = TAUNTS[Math.min(fleeCount, TAUNTS.length - 1)];
}

function resetReject() {
    rejectBtn.classList.remove('fled');
    rejectBtn.style.left = rejectBtn.style.top = '';
    rejectBtn.style.width = rejectBtn.style.height = '';
    rejectScale = 1; acceptScale = 1; fleeCount = 0;
    rejectBtn.style.transform = ''; startBtn.style.transform = '';
    rejectBtn.textContent = '拒 绝';
}

// 鼠标悬停、手指按下、真的点到 —— 全部触发逃跑
['pointerenter', 'pointerdown'].forEach(ev =>
    rejectBtn.addEventListener(ev, e => { e.preventDefault(); fleeReject(); }, { passive: false }));
rejectBtn.addEventListener('click', e => {
    e.preventDefault();
    showToast('拒绝无效，心意已发送 ♥');
    fleeReject();
});

// ===== 动画部分（与之前完全一致）=====
const PHRASES = [
    "姐姐我想你了", "姐姐天天开心", "姐姐会不会想我呢",
    "姐姐有没有好好吃饭", "姐姐早点睡觉", "不要熬夜",
    "我好喜欢你呢", "跟你一起玩好开心", "姐姐要天天开心",
    "跟烦恼说拜拜", "嘻嘻嘻", "姐姐不要生我的气", "我不会惹姐姐生气了", "姐姐 我是不是很乖"
    ,"姐姐，我很乖的" , "记得好好吃饭" , "天冷了，记得多穿衣服呢"
];
const TEXT_PALETTE = [
    [255, 150, 180, 235], [255, 190, 130, 235],
    [200, 165, 255, 235], [150, 220, 255, 235], [255, 215, 160, 235]
];
const STAR_COUNT = 160, RAIN_COUNT = 100, TEXT_COUNT = 22;

let W = 0, H = 0, DPR = 1;
let running = false, rafId = 0, lastT = 0, jj = 0;
const stars = [], rain = [], texts = [];

function rnd(a, b) { return a + Math.random() * (b - a); }
function rgba(c) { return `rgba(${c[0]},${c[1]},${c[2]},${c[3] / 255})`; }

function sizeCanvas() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function makeHeartSprite(color, s) {
    const w = Math.ceil(s * 1.3) + 4;
    const c = document.createElement('canvas');
    c.width = c.height = w;
    const x = c.getContext('2d');
    x.fillStyle = rgba(color);
    const cx = w / 2, cy = w / 2;
    x.beginPath();
    x.moveTo(cx, cy + s * 0.35);
    x.bezierCurveTo(cx - s * 0.55, cy + s * 0.02, cx - s * 0.48, cy - s * 0.42, cx, cy - s * 0.14);
    x.bezierCurveTo(cx + s * 0.48, cy - s * 0.42, cx + s * 0.55, cy + s * 0.02, cx, cy + s * 0.35);
    x.closePath();
    x.fill();
    return { img: c, pad: w / 2 };
}

function makeTextSprite(text, color, fs) {
    const font = fs + 'px "楷体", "Kaiti SC", "STKaiti", serif';
    const m = document.createElement('canvas').getContext('2d');
    m.font = font;
    const w = Math.ceil(m.measureText(text).width);
    const c = document.createElement('canvas');
    c.width = w + 8; c.height = Math.ceil(fs * 1.6) + 8;
    const x = c.getContext('2d');
    x.font = font; x.textBaseline = 'top';
    x.fillStyle = rgba(color);
    x.fillText(text, 4, 4);
    return { img: c, pad: 4 };
}

function resetRain(i, startTop) {
    const color = [255, 120 + Math.floor(rnd(0, 90)), 170 + Math.floor(rnd(0, 70)), 200];
    const size = Math.floor(rnd(14, 32));
    rain[i] = {
        x: Math.random(),
        y: startTop ? rnd(-800, 0) : rnd(0, H),
        speed: rnd(3.5, 7.0),
        sway: rnd(10, 35),
        phase: rnd(0, Math.PI * 2),
        sprite: makeHeartSprite(color, size)
    };
}

function resetText(i, startTop) {
    texts[i] = {
        x: Math.random(),
        y: startTop ? rnd(-600, 0) : rnd(0, H),
        speed: rnd(5.0, 9.0),
        sway: rnd(8, 28),
        phase: rnd(0, Math.PI * 2),
        sprite: makeTextSprite(PHRASES[Math.floor(Math.random() * PHRASES.length)],
            TEXT_PALETTE[Math.floor(Math.random() * TEXT_PALETTE.length)],
            Math.floor(rnd(12, 19)))
    };
}

function initScene() {
    stars.length = 0; rain.length = 0; texts.length = 0;
    for (let i = 0; i < STAR_COUNT; i++)
        stars.push({ x: Math.random(), y: Math.random(), phase: rnd(0, Math.PI * 2) });
    for (let i = 0; i < RAIN_COUNT; i++) resetRain(i, true);
    for (let i = 0; i < TEXT_COUNT; i++) resetText(i, true);
}

const PER = 36, ZS = new Float64Array(PER);
for (let i = 0; i < PER; i++) ZS[i] = (i / PER) * (Math.PI / 2.0) * 13;
const LAYERS = [];
for (let ii = 30; ii > 0; ii--) {
    const t = ii / 30.0;
    LAYERS.push({
        color: `rgb(${Math.floor(20 + t * 60)},${Math.floor(150 + t * 100)},${Math.floor(170 + t * 85)})`,
        spread: ii * Math.sqrt(ii),
        zOff: (30 - ii) * 0.05
    });
}

function update(step) {
    for (let i = 0; i < RAIN_COUNT; i++) {
        const r = rain[i];
        r.y += r.speed * step;
        if (r.y > H + 40) resetRain(i, true);
    }
    for (let i = 0; i < TEXT_COUNT; i++) {
        const t = texts[i];
        t.y += t.speed * step;
        if (t.y > H + 40) resetText(i, true);
    }
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < STAR_COUNT; i++) {
        const s = stars[i];
        const twinkle = 0.5 + 0.5 * Math.sin(jj * 0.3 + s.phase);
        ctx.fillStyle = `rgba(255,255,255,${(60 + twinkle * 180) / 255})`;
        ctx.fillRect(s.x * W, s.y * H, 2, 2);
    }

    const cx = W / 2, cy = H / 3;
    let size = (14.75 + 0.25 * Math.sin(jj * Math.PI / 10)) * Math.min(1, W / 620);
    const glow = 120 * size / 15.0;
    ctx.fillStyle = 'rgba(70,210,190,0.12)';
    ctx.beginPath();
    ctx.arc(cx, cy, glow, 0, Math.PI * 2);
    ctx.fill();

    for (let L = 0; L < LAYERS.length; L++) {
        const lay = LAYERS[L];
        ctx.fillStyle = lay.color;
        for (let i = 0; i < PER; i++) {
            const z = ZS[i] + lay.zOff;
            const px = (Math.random() < 0.5 ? -1 : 1) * Math.random() * lay.spread;
            const py = (Math.random() < 0.5 ? -1 : 1) * Math.random() * lay.spread;
            const x = 16 * Math.pow(Math.sin(z), 3) * size + px + cx;
            const y = -(13 * Math.cos(z) - 5 * Math.cos(2 * z) - 2 * Math.cos(3 * z) - Math.cos(4 * z)) * size + py + cy;
            ctx.fillRect(x, y, 2, 2);
        }
    }

    for (let i = 0; i < RAIN_COUNT; i++) {
        const r = rain[i];
        const px = r.x * W + Math.sin(jj * 0.05 + r.phase) * r.sway - r.sprite.pad;
        ctx.drawImage(r.sprite.img, px, r.y - r.sprite.pad);
    }

    for (let i = 0; i < TEXT_COUNT; i++) {
        const t = texts[i];
        const px = t.x * W + Math.sin(jj * 0.04 + t.phase) * t.sway - t.sprite.pad;
        ctx.drawImage(t.sprite.img, px, t.y - t.sprite.img.height + t.sprite.pad);
    }
}

function loop(now) {
    if (!running) return;
    if (!lastT) lastT = now;
    let dt = now - lastT;
    lastT = now;
    if (dt > 60) dt = 60;
    jj += dt / 50;
    update(dt / 50);
    draw();
    rafId = requestAnimationFrame(loop);
}

function start() {
    initScene();
    jj = 0; lastT = 0; running = true;
    rafId = requestAnimationFrame(loop);
}

startBtn.addEventListener('click', () => {
    document.getElementById('launcher').style.display = 'none';
    document.getElementById('exitBtn').style.display = 'block';
    start();
});
document.getElementById('exitBtn').addEventListener('click', () => {
    running = false;
    cancelAnimationFrame(rafId);
    document.getElementById('exitBtn').style.display = 'none';
    document.getElementById('launcher').style.display = 'flex';
    resetReject(); // 回到开始页时拒绝按钮复位，继续骗人
});

let resizeTimer = 0;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(sizeCanvas, 150);
});

sizeCanvas();
initScene();
draw();
</script>
</body>
</html>
