<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Heart Beat</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }
    #stage {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #000;
    }
    #launcher {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: rgba(20, 20, 30, 0.96);
        z-index: 20;
    }
    #launcher .tip {
        color: rgb(255, 180, 200);
        font-family: "楷体", "Kaiti SC", "STKaiti", serif;
        font-size: 22px;
    }
    .pink-btn {
        border: none;
        outline: none;
        cursor: pointer;
        color: #fff;
        font-family: "楷体", "Kaiti SC", serif;
        font-weight: bold;
        background: rgb(255, 120, 160);
        border-radius: 24px;
        transition: background .15s;
    }
    .pink-btn:active {
        background: rgb(255, 90, 140);
    }
    #startBtn {
        font-size: 22px;
        padding: 14px 46px;
    }
    #exitBtn {
        position: fixed;
        left: max(20px, 4vw);
        top: max(20px, 4vw);
        font-size: 16px;
        padding: 9px 24px;
        z-index: 15;
        display: none;
    }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<button id="exitBtn" class="pink-btn">退出 ♥</button>
<div id="launcher">
    <div class="tip">有一份惊喜，要点开看看吗 ♥</div>
    <button id="startBtn" class="pink-btn">开 始</button>
</div>
<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

const PHRASES = [
    "姐姐我想你了",
    "姐姐天天开心",
    "姐姐会不会想我呢",
    "姐姐有没有好好吃饭",
    "姐姐早点睡觉",
    "不要熬夜",
    "我好喜欢你呢",
    "跟你一起玩好开心",
    "姐姐要天天开心",
    "跟烦恼说拜拜",
    "嘻嘻嘻",
    "姐姐不要生我的气",
    "我不会惹姐姐生气了",
    "姐姐 我是不是很乖"
];

const TEXT_PALETTE = [
    [255, 150, 180, 235],
    [255, 190, 130, 235],
    [200, 165, 255, 235],
    [150, 220, 255, 235],
    [255, 215, 160, 235]
];

const STAR_COUNT = 150;
const RAIN_COUNT = 14;
const TEXT_COUNT = 12;

let W = 0;
let H = 0;
let DPR = 1;
let t = 0;
let running = false;
let rafId = 0;
let lastTime = 0;

const stars = [];
const rain = [];
const texts = [];

function rnd(a, b) {
    return a + Math.random() * (b - a);
}

function sizeCanvas() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function initScene() {
    stars.length = 0;
    rain.length = 0;
    texts.length = 0;

    for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
            x: Math.random(),
            y: Math.random(),
            p: rnd(0, Math.PI * 2)
        });
    }

    for (let i = 0; i < RAIN_COUNT; i++) {
        rain.push({
            x: rnd(0.15, 0.85),
            y: rnd(-120, -20),
            baseY: rnd(-120, -20),
            speed: rnd(0.32, 0.55),
            size: Math.floor(rnd(15, 24)),
            drift: rnd(-0.004, 0.004),
            noise: rnd(0, Math.PI * 2)
        });
    }

    for (let i = 0; i < TEXT_COUNT; i++) {
        texts.push({
            phrase: Math.floor(Math.random() * PHRASES.length),
            x: rnd(0.12, 0.88),
            y: rnd(-140, -30),
            baseY: rnd(-140, -30),
            speed: rnd(0.26, 0.48),
            drift: rnd(-0.003, 0.003),
            noise: rnd(0, Math.PI * 2),
            color: TEXT_PALETTE[Math.floor(Math.random() * TEXT_PALETTE.length)],
            fs: Math.floor(rnd(17, 24))
        });
    }
}

function resetRain(i) {
    rain[i].x = rnd(0.15, 0.85);
    rain[i].baseY = -rnd(80, 160);
    rain[i].y = rain[i].baseY;
    rain[i].speed = rnd(0.32, 0.55);
    rain[i].size = Math.floor(rnd(15, 24));
    rain[i].drift = rnd(-0.004, 0.004);
}

function resetText(i) {
    texts[i].x = rnd(0.12, 0.88);
    texts[i].baseY = -rnd(90, 170);
    texts[i].y = texts[i].baseY;
    texts[i].speed = rnd(0.26, 0.48);
    texts[i].drift = rnd(-0.003, 0.003);
    texts[i].phrase = Math.floor(Math.random() * PHRASES.length);
    texts[i].color = TEXT_PALETTE[Math.floor(Math.random() * TEXT_PALETTE.length)];
    texts[i].fs = Math.floor(rnd(17, 24));
}

function drawHeart() {
    const cx = W / 2;
    const cy = H * 0.42;
    const scale = Math.min(W, H) * 0.0235;
    const layers = 42;

    for (let layer = 0; layer < layers; layer++) {
        const k = layer / layers;

        const r = Math.floor(15 + k * 50);
        const g = Math.floor(200 - k * 70);
        const b = Math.floor(120 + k * 70);

        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;

        const points = 32 + Math.floor(layer * 1.4);
        const s = scale * (0.25 + k * 0.85);

        for (let i = 0; i < points; i++) {
            const a = (i / points) * Math.PI * 2;

            const hx = 16 * Math.pow(Math.sin(a), 3);
            const hy = -(
                13 * Math.cos(a)
                - 5 * Math.cos(2 * a)
                - 2 * Math.cos(3 * a)
                - Math.cos(4 * a)
            );

            const x = hx * s * 0.26 + cx;
            const y = hy * s * 0.26 + cy;

            if (isFinite(x) && isFinite(y)) {
                ctx.fillRect(x, y, 2, 2);
            }
        }
    }
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < STAR_COUNT; i++) {
        const s = stars[i];
        const a = 0.25 + 0.35 * Math.sin(t * 0.04 + s.p);
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, 1, 0, Math.PI * 2);
        ctx.fill();
    }

    drawHeart();

    for (let i = 0; i < RAIN_COUNT; i++) {
        const r = rain[i];

        r.baseY += r.speed * 16.67;
        r.x += r.drift * 16.67;
        r.noise += 0.012;

        const sway = Math.sin(r.noise) * 0.015;
        const px = (r.x + sway) * W;
        const py = r.baseY;

        if (py > H + 40) {
            resetRain(i);
            continue;
        }

        ctx.fillStyle = 'rgba(255, 110, 160, 0.9)';
        ctx.font = r.size + 'px sans-serif';
        ctx.fillText('♥', px, py);
    }

    for (let i = 0; i < TEXT_COUNT; i++) {
        const tx = texts[i];

        tx.baseY += tx.speed * 16.67;
        tx.x += tx.drift * 16.67;
        tx.noise += 0.01;

        const sway = Math.sin(tx.noise) * 0.012;
        const px = (tx.x + sway) * W;
        const py = tx.baseY;

        if (py > H + 40) {
            resetText(i);
            continue;
        }

        ctx.font = tx.fs + 'px "楷体", "Kaiti SC", serif';
        ctx.fillStyle = `rgba(${tx.color[0]},${tx.color[1]},${tx.color[2]},${tx.color[3] / 255})`;
        ctx.fillText(PHRASES[tx.phrase], px, py);
    }
}

function loop(now) {
    if (!running) return;

    const dt = Math.min(now - lastTime, 50);
    lastTime = now;
    t += dt * 0.06;

    draw();
    rafId = requestAnimationFrame(loop);
}

function start() {
    initScene();
    t = 0;
    lastTime = performance.now();
    running = true;
    rafId = requestAnimationFrame(loop);
}

document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('launcher').style.display = 'none';
    document.getElementById('exitBtn').style.display = 'block';
    start();
});

document.getElementById('exitBtn').addEventListener('click', () => {
    running = false;
    cancelAnimationFrame(rafId);
    document.getElementById('exitBtn').style.display = 'none';
    document.getElementById('launcher').style.display = 'flex';
});

window.addEventListener('resize', () => {
    sizeCanvas();
    if (!running) draw();
});

sizeCanvas();
initScene();
draw();
</script>
</body>
</html>
