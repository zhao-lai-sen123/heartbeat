<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Heart Beat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #stage { display: block; width: 100vw; height: 100vh; background: #000; }
        #launcher {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 28px;
            background: rgba(20, 20, 30, 0.96); z-index: 20;
        }
        #launcher .tip {
            color: rgb(255, 180, 200);
            font-family: "楷体", "Kaiti SC", "STKaiti", serif;
            font-size: 22px;
        }
        .pink-btn {
            border: none; outline: none; cursor: pointer; color: #fff;
            font-family: "楷体", "Kaiti SC", serif;
            font-weight: bold;
            background: rgb(255, 120, 160);
            border-radius: 24px; transition: background .15s;
        }
        .pink-btn:active { background: rgb(255, 90, 140); }
        #startBtn { font-size: 22px; padding: 14px 46px; }
        #exitBtn {
            position: fixed; left: max(20px, 4vw); top: max(20px, 4vw);
            font-size: 16px; padding: 9px 24px;
            z-index: 15; display: none;
        }
    </style>
</head>
<body>
<canvas id="stage"></canvas>
<button id="exitBtn" class="pink-btn">退出 ♥</button>
<div id="launcher">
    <div class="tip">有一份惊喜，要点开看看吗 ♥</div>
    <button id="startBtn" class="pink-btn">开 始</button>
</div>
<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    const PHRASES = [
        "姐姐我想你了", "姐姐天天开心", "姐姐会不会想我呢",
        "姐姐有没有好好吃饭", "姐姐早点睡觉", "不要熬夜",
        "我好喜欢你呢", "跟你一起玩好开心", "姐姐要天天开心",
        "跟烦恼说拜拜", "嘻嘻嘻", "姐姐不要生我的气",
        "我不会惹姐姐生气了", "姐姐 我是不是很乖"
    ];

    const TEXT_PALETTE = [
        [255, 150, 180, 235],
        [255, 190, 130, 235],
        [200, 165, 255, 235],
        [150, 220, 255, 235],
        [255, 215, 160, 235]
    ];

    const STAR_COUNT = 140;
    const RAIN_COUNT = 18;
    const TEXT_COUNT = 14;
    const MAX_FRAME = 120;

    let W = 0, H = 0, DPR = 1;
    let jj = 0;
    let running = false;
    let rafId = 0;
    let lastTime = performance.now();

    const stars = [];
    const rain = [];
    const texts = [];

    function rnd(a, b) {
        return a + Math.random() * (b - a);
    }

    function sizeCanvas() {
        DPR = window.devicePixelRatio || 1;
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    function initScene() {
        stars.length = 0;
        rain.length = 0;
        texts.length = 0;
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({ x: Math.random(), y: Math.random(), phase: rnd(0, Math.PI * 2) });
        }
        for (let i = 0; i < RAIN_COUNT; i++) {
            rain.push({
                x: rnd(0.12, 0.88),
                y: rnd(-H * 1.3, 0),
                vy: rnd(0.35, 0.7),
                size: Math.floor(rnd(16, 26)),
                swayAmp: rnd(6, 18),
                swayFreq: rnd(0.008, 0.02),
                phase: rnd(0, Math.PI * 2)
            });
        }
        for (let i = 0; i < TEXT_COUNT; i++) {
            texts.push({
                phrase: Math.floor(Math.random() * PHRASES.length),
                x: rnd(0.1, 0.9),
                y: rnd(-H * 1.3, 0),
                vy: rnd(0.28, 0.55),
                swayAmp: rnd(5, 16),
                swayFreq: rnd(0.006, 0.018),
                phase: rnd(0, Math.PI * 2),
                color: TEXT_PALETTE[Math.floor(Math.random() * TEXT_PALETTE.length)],
                fs: Math.floor(rnd(18, 26))
            });
        }
    }

    function resetRain(i) {
        rain[i].x = rnd(0.12, 0.88);
        rain[i].y = -rnd(60, 180);
        rain[i].vy = rnd(0.35, 0.7);
        rain[i].size = Math.floor(rnd(16, 26));
        rain[i].swayAmp = rnd(6, 18);
        rain[i].swayFreq = rnd(0.008, 0.02);
    }

    function resetText(i) {
        texts[i].x = rnd(0.1, 0.9);
        texts[i].y = -rnd(60, 180);
        texts[i].vy = rnd(0.28, 0.55);
        texts[i].swayAmp = rnd(5, 16);
        texts[i].swayFreq = rnd(0.006, 0.018);
        texts[i].phrase = Math.floor(Math.random() * PHRASES.length);
        texts[i].color = TEXT_PALETTE[Math.floor(Math.random() * TEXT_PALETTE.length)];
        texts[i].fs = Math.floor(rnd(18, 26));
    }

    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        for (let i = 0; i < STAR_COUNT; i++) {
            const s = stars[i];
            const twinkle = 0.5 + 0.5 * Math.sin(jj * 0.025 + s.phase);
            ctx.fillStyle = `rgba(255,255,255,${(50 + twinkle * 160) / 255})`;
            ctx.beginPath();
            ctx.arc(s.x * W, s.y * H, 1.1, 0, Math.PI * 2);
            ctx.fill();
        }

        const cx = W / 2;
        const cy = H * 0.42;
        const size = 14;
        const glow = 110;

        ctx.fillStyle = 'rgba(70,210,190,0.10)';
        ctx.beginPath();
        ctx.arc(cx, cy, glow, 0, Math.PI * 2);
        ctx.fill();

        // 修复iPhone爱心空心，饱满绿色粒子填充
        const heartLayers = 40;
        for (let ii = 1; ii <= heartLayers; ii++) {
            const layerProgress = ii / heartLayers;
            const r = Math.floor(20 + layerProgress * 35);
            const g = Math.floor(180 - layerProgress * 55);
            const b = Math.floor(130 + layerProgress * 50);
            ctx.fillStyle = `rgb(${r},${g},${b})`;

            const pointCount = 28 + Math.floor(ii * 1.6);
            const layerSize = size * (0.35 + layerProgress * 0.78);
            const shake = size * 0.11;

            for (let i = 0; i < pointCount; i++) {
                const angle = (i / pointCount) * Math.PI * 2;
                const pulse = 1 + Math.sin(jj * 0.04 + ii * 0.13) * 0.035;

                const hx = 16 * Math.pow(Math.sin(angle), 3);
                const hy = -(
                    13 * Math.cos(angle)
                    - 5 * Math.cos(2 * angle)
                    - 2 * Math.cos(3 * angle)
                    - Math.cos(4 * angle)
                );

                const x = hx * layerSize * 0.26 * pulse
                    + (Math.random() - 0.5) * shake
                    + cx;

                const y = hy * layerSize * 0.26 * pulse
                    + (Math.random() - 0.5) * shake * 0.7
                    + cy;

                if (isFinite(x) && isFinite(y)) {
                    ctx.fillRect(x, y, 2, 2);
                }
            }
        }

        for (let i = 0; i < RAIN_COUNT; i++) {
            const r = rain[i];
            const px = r.x * W + Math.sin(r.phase) * r.swayAmp;
            const py = r.y;
            ctx.fillStyle = 'rgba(255, 110, 160, 0.9)';
            ctx.font = r.size + 'px sans-serif';
            ctx.fillText('♥', px, py);
        }

        for (let i = 0; i < TEXT_COUNT; i++) {
            const tx = texts[i];
            const px = tx.x * W + Math.sin(tx.phase) * tx.swayAmp;
            const py = tx.y;
            ctx.font = tx.fs + 'px "楷体", "Kaiti SC", serif';
            ctx.fillStyle = `rgba(${tx.color[0]},${tx.color[1]},${tx.color[2]},${tx.color[3] / 255})`;
            ctx.fillText(PHRASES[tx.phrase], px, py);
        }
    }

    function loop(now) {
        if (!running) return;
        const dt = Math.min(now - lastTime, 50);
        lastTime = now;
        jj += dt * 0.06;
        if (jj > MAX_FRAME) jj -= MAX_FRAME;

        for (let i = 0; i < RAIN_COUNT; i++) {
            const r = rain[i];
            r.y += r.vy * dt;
            r.phase += r.swayFreq * dt;
            if(r.y > H + 40) resetRain(i);
        }
        for (let i = 0; i < TEXT_COUNT; i++) {
            const tx = texts[i];
            tx.y += tx.vy * dt;
            tx.phase += tx.swayFreq * dt;
            if(tx.y > H + 40) resetText(i);
        }

        draw();
        rafId = requestAnimationFrame(loop);
    }

    function start() {
        initScene();
        jj = 0;
        lastTime = performance.now();
        running = true;
        rafId = requestAnimationFrame(loop);
    }

    document.getElementById('startBtn').addEventListener('click', () => {
        document.getElementById('launcher').style.display = 'none';
        document.getElementById('exitBtn').style.display = 'block';
        start();
    });

    document.getElementById('exitBtn').addEventListener('click', () => {
        running = false;
        cancelAnimationFrame(rafId);
        document.getElementById('exitBtn').style.display = 'none';
        document.getElementById('launcher').style.display = 'flex';
    });

    window.addEventListener('resize', ()=>{
        sizeCanvas();
        if(!running) draw();
    });

    sizeCanvas();
    initScene();
    draw();
</script>
</body>
</html>
