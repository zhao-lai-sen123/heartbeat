<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Beat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        #stage { display: block; width: 100vw; height: 100vh; background: #000; }
        #launcher {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 28px;
            background: rgba(20, 20, 30, 0.96); z-index: 20;
        }
        #launcher .tip {
            color: rgb(255, 180, 200);
            font-family: "楷体", "Kaiti SC", "STKaiti", serif;
            font-size: 22px;
        }
        .pink-btn {
            border: none; outline: none; cursor: pointer; color: #fff;
            font-family: "楷体", "Kaiti SC", "STKaiti", serif;
            font-weight: bold;
            background: rgb(255, 120, 160);
            border-radius: 24px; transition: background .1s;
        }
        .pink-btn:active { background: rgb(255, 90, 140); }
        #startBtn { font-size: 22px; padding: 14px 46px; }
        #exitBtn {
            position: fixed; left: 40px; top: 40px;
            font-size: 16px; padding: 9px 24px;
            z-index: 15; display: none;
        }
    </style>
</head>
<body>
<canvas id="stage"></canvas>
<button id="exitBtn" class="pink-btn">退出 ♥</button>
<div id="launcher">
    <div class="tip">有一份惊喜，要点开看看吗 ♥</div>
    <button id="startBtn" class="pink-btn">开 始</button>
</div>
<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    const TEXT_PALETTE = [
        [255, 150, 180, 235], [255, 190, 130, 235],
        [200, 165, 255, 235], [150, 220, 255, 235], [255, 215, 160, 235]
    ];
    const STAR_COUNT = 160, RAIN_COUNT = 35, TEXT_COUNT = 22, MAX_FRAME = 100;
    let W = 0, H = 0, DPR = 1, jj = 0, running = false, rafId = 0;
    const stars = [], rain = [], texts = [];
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function sizeCanvas() {
        DPR = window.devicePixelRatio || 1;
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * DPR; canvas.height = H * DPR;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    function resetRain(i, startTop) {
        rain[i] = {
            x: Math.random(), y: startTop ? rnd(-800, 0) : rnd(0, H),
            speed: rnd(1.5, 4.0), size: Math.floor(rnd(14, 32)),
            sway: rnd(10, 35), phase: rnd(0, Math.PI * 2),
            color: [255, 120 + Math.floor(rnd(0, 90)), 170 + Math.floor(rnd(0, 70)), 200]
        };
    }
    function resetText(i, startTop) {
        texts[i] = {
            phrase: Math.floor(Math.random() * PHRASES.length),
            x: Math.random(), y: startTop ? rnd(-600, 0) : rnd(0, H),
            speed: rnd(2.5, 5.5), sway: rnd(8, 28), phase: rnd(0, Math.PI * 2),
            color: TEXT_PALETTE[Math.floor(Math.random() * TEXT_PALETTE.length)],
            fs: Math.floor(rnd(20, 30))
        };
    }
    function initScene() {
        stars.length = 0; rain.length = 0; texts.length = 0;
        for (let i = 0; i < STAR_COUNT; i++)
            stars.push({ x: Math.random(), y: Math.random(), phase: rnd(0, Math.PI * 2) });
        for (let i = 0; i < RAIN_COUNT; i++) resetRain(i, true);
        for (let i = 0; i < TEXT_COUNT; i++) resetText(i, true);
    }
    function draw() {
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
        for (let i = 0; i < STAR_COUNT; i++) {
            const s = stars[i];
            const twinkle = 0.5 + 0.5 * Math.sin(jj * 0.3 + s.phase);
            ctx.fillStyle = `rgba(255,255,255,${(60 + twinkle * 180) / 255})`;
            ctx.beginPath(); ctx.arc(s.x * W, s.y * H, 1.2, 0, Math.PI * 2); ctx.fill();
        }
        const cx = W / 2, cy = H * 0.42;
        const size = (Math.floor(jj / 10) % 2 === 0) ? 14.5 : 15;
        const glow = 120 * size / 15.0;
        ctx.fillStyle = 'rgba(70,210,190,0.12)';
        ctx.beginPath(); ctx.arc(cx, cy, glow, 0, Math.PI * 2); ctx.fill();
        for (let ii = 30; ii > 0; ii--) {
            const t = ii / 30.0;
            ctx.fillStyle = `rgb(${Math.floor(20 + t * 60)},${Math.floor(150 + t * 100)},${Math.floor(170 + t * 85)})`;
            for (let i = 0; i < 36; i++) {
                const z = (i / 36.0) * (Math.PI / 2.0) * 13 + (30 - ii) * 0.05;
                const px = (Math.random() < 0.5 ? -1 : 1) * Math.random() * ii * Math.sqrt(ii);
                const py = (Math.random() < 0.5 ? -1 : 1) * Math.random() * ii * Math.sqrt(ii);
                const x = 16 * Math.pow(Math.sin(z), 3) * size + px + cx;
                const y = -(13 * Math.cos(z) - 5 * Math.cos(2 * z) - 2 * Math.cos(3 * z) - Math.cos(4 * z)) * size + py + cy;
                ctx.fillRect(x, y, 2, 2);
            }
        }
        for (let i = 0; i < RAIN_COUNT; i++) {
            const r = rain[i];
            r.y += r.speed;
            const px = r.x * W + Math.sin(jj * 0.05 + r.phase) * r.sway;
            if (r.y > H + 30) resetRain(i, true);
            ctx.fillStyle = `rgba(${r.color[0]},${r.color[1]},${r.color[2]},${r.color[3] / 255})`;
            ctx.font = r.size + 'px sans-serif';
            ctx.fillText('♥', px, r.y);
        }
        for (let i = 0; i < TEXT_COUNT; i++) {
            const tx = texts[i];
            tx.y += tx.speed;
            const px = tx.x * W + Math.sin(jj * 0.04 + tx.phase) * tx.sway;
            if (tx.y > H + 30) resetText(i, true);
            ctx.font = tx.fs + 'px "楷体", "Kaiti SC", serif';
            ctx.fillStyle = `rgba(${tx.color[0]},${tx.color[1]},${tx.color[2]},${tx.color[3] / 255})`;
            ctx.fillText(PHRASES[tx.phrase], px, tx.y);
        }
    }
    function loop() {
        if (!running) return;
        jj++; if (jj > MAX_FRAME) jj = 0;
        draw();
        rafId = requestAnimationFrame(loop);
    }
    function start() { initScene(); jj = 0; running = true; loop(); }
    document.getElementById('startBtn').addEventListener('click', () => {
        document.getElementById('launcher').style.display = 'none';
        document.getElementById('exitBtn').style.display = 'block';
        start();
    });
    document.getElementById('exitBtn').addEventListener('click', () => {
        running = false; cancelAnimationFrame(rafId);
        document.getElementById('exitBtn').style.display = 'none';
        document.getElementById('launcher').style.display = 'flex';
    });
    window.addEventListener('resize', sizeCanvas);
    sizeCanvas(); initScene(); draw();
</script>
</body>
</html>
